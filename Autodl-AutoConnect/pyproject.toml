[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autodl-autoconnect"
version = "1.1.0"
description = "拿 AutoDL 开发者 Token 直接抢空闲 GPU 实例的 CLI 工具，可被 Agent 接管。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["autodl", "gpu", "cloud", "cli", "agent", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
# 运行时零依赖：只用 Python 标准库。
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
autodl-ac = "autodl_autoconnect.cli:main"

[tool.setuptools]
packages = ["autodl_autoconnect"]

[tool.setuptools.package-data]
autodl_autoconnect = ["py.typed"]
